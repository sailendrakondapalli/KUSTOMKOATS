# SPA static server for the Kustom Koats frontend (nginx-unprivileged, port 8080)
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Liveness/readiness probe - does not touch the app
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Never serve dotfiles (.env, .git, ...) - except ACME/.well-known
    location ~ /\.(?!well-known/) {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    # Hashed build output: cache forever; missing files are real 404s
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Other static files from public/ (images, video, robots, sitemap)
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|mp4|mov|webm|lottie|txt|xml|json|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # SPA fallback: every other path serves index.html, which must revalidate
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
